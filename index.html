<!DOCTYPE html><html lang="zh-HK"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOOS-3 膝關節功能評估工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;
  background:#1a365d; /* 改為深海藍色，對比度高且沉穩 */
  color:#fff;
  overflow-x:hidden;
}
/* ── Speech unlock overlay ── */
#speech-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.92);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:1000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#speech-overlay .tap-icon{
  font-size:6rem;margin-bottom:1.5rem;
  animation:pulse 1.4s ease-in-out infinite;
}
#speech-overlay .tap-text{font-size:2.8rem;font-weight:bold;text-align:center;padding:0 1rem;}
#speech-overlay .tap-sub{font-size:1.3rem;margin-top:.8rem;opacity:.7;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.18);opacity:.65}
}
/* ── No-speech banner ── */
#no-speech-banner{
  display:none;position:fixed;top:0;left:0;right:0;
  background:#e74c3c;color:#fff;text-align:center;
  padding:.7rem;font-size:1.2rem;z-index:500;
}
/* ── App container ── */
#app{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:1rem .7rem 2rem;
}
/* ── Header ── */
.header-title{font-size:1.8rem;font-weight:bold;text-align:center;margin-top:.4rem;}
.header-sub{font-size:1.1rem;text-align:center;opacity:.75;margin-top:.2rem;margin-bottom:.8rem;}
/* ── Progress ── */
#progress-area{width:100%;max-width:700px;margin-bottom:1rem;}
#progress-text{font-size:1.6rem;font-weight:bold;text-align:center;margin-bottom:.5rem;}
#progress-bar-bg{width:100%;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;}
#progress-bar-fill{height:100%;width:0;background:#66d9a0;border-radius:6px;transition:width .4s ease;}
/* ── Question card ── */
#question-card{
  background:#fff;color:#222;border-radius:16px;
  padding:1.6rem 1.2rem 1rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.2rem;
}
#question-section{font-size:1.1rem;color:#1a365d;font-weight:bold;margin-bottom:.2rem;background:#e1effe;display:inline-block;padding:.2rem .8rem;border-radius:10px;}
#question-number{font-size:1.1rem;color:#999;margin-bottom:.35rem;font-weight:bold;}
#question-text{font-size:1.9rem;font-weight:bold;line-height:1.6;color:#111;}
/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#ececec;color:#555;border:none;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#ddd;}
/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.75rem;
}
/* ── Answer buttons ── */
.answer-btn{
  border:none;border-radius:14px;
  padding:1.2rem 1rem;
  font-size:1.8rem;font-weight:bold;
  color:#fff;cursor:pointer;
  transition:transform .15s,opacity .15s,box-shadow .3s,filter .3s;
  box-shadow:0 5px 0 rgba(0,0,0,.22);
  text-align:center;user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:4.5rem;
  display:flex;align-items:center;justify-content:flex-start;
  padding-left:1.5rem;gap:1.2rem;position:relative;
}
.answer-btn:active:not(.locked){transform:scale(.96);}
.answer-btn.locked{pointer-events:none;opacity:.35;filter:grayscale(.3);}
.answer-btn.selected{
  transform:scale(1.04);opacity:1!important;filter:none!important;
  box-shadow:0 0 0 5px #fff,0 5px 0 rgba(0,0,0,.22);
}
.answer-btn.glow{
  animation:glowPulse .7s ease-in-out infinite alternate;
  z-index:10;transform:scale(1.04);
}
@keyframes glowPulse{
  0%{
    box-shadow:0 0 12px rgba(255,255,255,0.6),0 0 24px rgba(255,255,255,0.3),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.15);
  }
  100%{
    box-shadow:0 0 24px rgba(255,255,255,1),0 0 48px rgba(255,255,255,0.5),0 0 72px rgba(255,255,255,0.2),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.35);
  }
}
/* 5個級別的顏色漸變 */
.lvl-0 { background: #2ecc71; }
.lvl-1 { background: #27ae60; }
.lvl-2 { background: #f39c12; }
.lvl-3 { background: #e67e22; }
.lvl-4 { background: #e74c3c; }

.btn-emoji{font-size:2.2rem;line-height:1;display:inline-block;width:3rem;text-align:center;}
/* ── Result screen ── */
#result-screen{display:none;width:100%;max-width:700px;text-align:center;}
.result-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;
}
.result-msg{font-size:1.6rem;line-height:1.9;margin-bottom:1.8rem;text-align:left;}
.result-scores{font-size:2rem;font-weight:bold;color:#222;text-align:left;background:#f9f9f9;padding:1.2rem;border-radius:12px;border:1px solid #ddd;}
.result-scores span{display:block;margin:.6rem 0;border-bottom:1px dashed #eee;padding-bottom:.6rem;}
.result-scores span:last-child{border-bottom:none;padding-bottom:0;}
.result-scores strong{color:#1a365d;font-size:2.2rem;}
.result-credit{font-size:1rem;color:#aaa;margin-top:1.4rem;text-align:center;}
#restart-btn{
  padding:1.2rem 3rem;background:#66d9a0;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#restart-btn:hover{background:#50c08a;}
#quiz-area{width:100%;display:flex;flex-direction:column;align-items:center;}
@media(min-width:600px){
  #question-text{font-size:2.3rem;}
  .answer-btn{font-size:2rem;padding:1.5rem 1.5rem;padding-left:2.5rem;}
  .btn-emoji{font-size:2.6rem;}
  .result-msg{font-size:1.8rem;}
  .result-scores{font-size:2.2rem;}
}
</style>
</head>
<body>
<div id="speech-overlay">
  <div class="tap-icon">🔊</div>
  <div class="tap-text">點按以啟用語音</div>
  <div class="tap-sub">Tap to enable voice</div>
</div>
<div id="no-speech-banner">此瀏覽器不支援語音朗讀</div>
<div id="app">
  <div class="header-title">KOOS-3 膝關節功能評估工具</div>
  <div class="header-sub">新界東醫院聯網 物理治療部</div>
  <div id="quiz-area">
    <div id="progress-area">
      <div id="progress-text"></div>
      <div id="progress-bar-bg"><div id="progress-bar-fill"></div></div>
    </div>
    <div id="question-card">
      <div id="question-section"></div>
      <div id="question-number"></div>
      <div id="question-text"></div>
      <div class="btn-row">
        <button class="card-btn" id="replay-btn">🔊 重播</button>
      </div>
    </div>
    <div id="answers-area"></div>
  </div>
  <div id="result-screen">
    <div class="result-card">
      <div class="result-msg" id="result-msg"></div>
      <div class="result-scores" id="result-scores"></div>
      <div class="result-credit">新界東醫院聯網 物理治療部製作</div>
    </div>
    <button id="restart-btn">🔄 重新開始</button>
  </div>
</div>
<script>
(function(){
  'use strict';
  /* ═══════════════════ DATA (KOOS-3 問卷庫) ═══════════════════ */
  var questions = [
    // ─── 第一部分：疼痛 (Pain, 9題) ───
    { id:'P1', section:'第一部分：疼痛', text:'你多常感到膝痛？', type:'Pain', optionsType:'freq' },
    { id:'P2', section:'第一部分：疼痛', text:'過去一星期，以膝關節為中心扭動或轉動身體時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P3', section:'第一部分：疼痛', text:'過去一星期，完全伸直膝關節時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P4', section:'第一部分：疼痛', text:'過去一星期，完全彎曲膝關節時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P5', section:'第一部分：疼痛', text:'過去一星期，在平地步行時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P6', section:'第一部分：疼痛', text:'過去一星期，上或下樓梯時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P7', section:'第一部分：疼痛', text:'過去一星期，晚上就寢時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P8', section:'第一部分：疼痛', text:'過去一星期，坐下或躺下時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },
    { id:'P9', section:'第一部分：疼痛', text:'過去一星期，挺直站立時會感到什麼程度的痛楚？', type:'Pain', optionsType:'pain_degree' },

    // ─── 第二部分：日常生活活動困難度 (PS, 7題) ───
    { id:'PS1', section:'第二部分：日常活動', text:'過去一星期，你在起床時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },
    { id:'PS2', section:'第二部分：日常活動', text:'過去一星期，你在穿襪子／絲襪時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },
    { id:'PS3', section:'第二部分：日常活動', text:'過去一星期，你在從坐姿站起時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },
    { id:'PS4', section:'第二部分：日常活動', text:'過去一星期，你在彎腰至地／在地上檢起物品時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },
    { id:'PS5', section:'第二部分：日常活動', text:'過去一星期，你在轉動／扭動受傷的膝關節時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },
    { id:'PS6', section:'第二部分：日常活動', text:'過去一星期，你在跪下時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },
    { id:'PS7', section:'第二部分：日常活動', text:'過去一星期，你在蹲坐時膝關節使你感到有多困難？', type:'PS', optionsType:'diff_degree' },

    // ─── 第三部分：膝關節對生活質量的影響 (QoL, 4題) ───
    { id:'Q1', section:'第三部分：生活質量', text:'你多常注意到你的膝關節問題？', type:'QoL', optionsType:'freq' },
    { id:'Q2', section:'第三部分：生活質量', text:'你是否有改變生活模式來避免一些有機會傷及膝關節的活動？', type:'QoL', optionsType:'qol_q2' },
    { id:'Q3', section:'第三部分：生活質量', text:'你是否對你的膝關節缺乏信心？', type:'QoL', optionsType:'qol_q3' },
    { id:'Q4', section:'第三部分：生活質量', text:'總括來說，你的膝關節對你的生活造成多大影響？', type:'QoL', optionsType:'qol_q4' }
  ];

  var optionSets = {
    freq: [
      { val: 0, text: '從不', emoji: '😊' },
      { val: 1, text: '每月一次', emoji: '🙂' },
      { val: 2, text: '每週一次', emoji: '😐' },
      { val: 3, text: '每日一次', emoji: '😟' },
      { val: 4, text: '經常', emoji: '😫' }
    ],
    pain_degree: [
      { val: 0, text: '沒有痛楚', emoji: '😊' },
      { val: 1, text: '輕微疼痛', emoji: '🙂' },
      { val: 2, text: '頗為疼痛', emoji: '😐' },
      { val: 3, text: '非常疼痛', emoji: '😟' },
      { val: 4, text: '極度疼痛', emoji: '😫' }
    ],
    diff_degree: [
      { val: 0, text: '沒有困難', emoji: '😊' },
      { val: 1, text: '少許困難', emoji: '🙂' },
      { val: 2, text: '頗大困難', emoji: '😐' },
      { val: 3, text: '非常困難', emoji: '😟' },
      { val: 4, text: '極度困難', emoji: '😫' }
    ],
    qol_q2: [
      { val: 0, text: '沒有改變', emoji: '😊' },
      { val: 1, text: '少許改變', emoji: '🙂' },
      { val: 2, text: '頗大改變', emoji: '😐' },
      { val: 3, text: '很大改變', emoji: '😟' },
      { val: 4, text: '完全改變', emoji: '😫' }
    ],
    qol_q3: [
      { val: 0, text: '完全沒有', emoji: '😊' },
      { val: 1, text: '少許', emoji: '🙂' },
      { val: 2, text: '普通', emoji: '😐' },
      { val: 3, text: '嚴重', emoji: '😟' },
      { val: 4, text: '極度', emoji: '😫' }
    ],
    qol_q4: [
      { val: 0, text: '完全沒有', emoji: '😊' },
      { val: 1, text: '少許', emoji: '🙂' },
      { val: 2, text: '頗大', emoji: '😐' },
      { val: 3, text: '非常大', emoji: '😟' },
      { val: 4, text: '極大', emoji: '😫' }
    ]
  };

  /* ─── PS 分數轉換對照表 (0分 至 28分) ─── */
  var psConversionTable = [
    100, 94, 90, 85, 81, 78, 75, 73, 70, 68, 
    66,  65, 63, 61, 60, 58, 56, 54, 52, 49, 
    46,  42, 38, 33, 28, 22, 16, 8,  0
  ];

  /* ─── STATE ─── */
  var currentIndex = 0;
  var answers = [];
  var locked = false;
  var speechEnabled = false;
  var speechOK = ('speechSynthesis' in window);
  var repeatTimer = null;
  var speechSeqId = 0;

  /* ─── DOM REFS ─── */
  var elOverlay = document.getElementById('speech-overlay');
  var elBanner = document.getElementById('no-speech-banner');
  var elProgressTxt = document.getElementById('progress-text');
  var elProgressBar = document.getElementById('progress-bar-fill');
  var elQSec = document.getElementById('question-section');
  var elQNum = document.getElementById('question-number');
  var elQText = document.getElementById('question-text');
  var elReplay = document.getElementById('replay-btn');
  var elAnswers = document.getElementById('answers-area');
  var elQuiz = document.getElementById('quiz-area');
  var elResult = document.getElementById('result-screen');
  var elResultMsg = document.getElementById('result-msg');
  var elResultScore = document.getElementById('result-scores');
  var elRestart = document.getElementById('restart-btn');

  /* ═══════════════════ VOICE SELECTION ═══════════════════ */
  var selectedVoice = null;
  function loadVoice(){
    if(!speechOK) return;
    var voices = window.speechSynthesis.getVoices();
    var zhHK = null, zhTW = null, zhAny = null;
    for(var i = 0; i < voices.length; i++){
      var lang = voices[i].lang || '';
      if(lang === 'zh-HK' && !zhHK) zhHK = voices[i];
      if(lang === 'zh-TW' && !zhTW) zhTW = voices[i];
      if(lang.indexOf('zh') === 0 && !zhAny) zhAny = voices[i];
    }
    selectedVoice = zhHK || zhTW || zhAny || null;
  }
  if(speechOK && typeof window.speechSynthesis.onvoiceschanged !== 'undefined'){
    window.speechSynthesis.onvoiceschanged = loadVoice;
  }

  function applyVoice(utter){
    if(!selectedVoice) loadVoice();
    utter.voice = selectedVoice;
    utter.lang = 'zh-HK';
    utter.rate = 0.85;
  }

  function clearAllGlow(){
    var btns = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove('glow');
  }

  /* ─── REPEAT TIMER (10 Seconds) ─── */
  function startRepeatTimer(){
    stopRepeatTimer();
    repeatTimer = setTimeout(function(){
      if(!locked){
        speakSequence();
      }
    }, 10000);
  }
  function stopRepeatTimer(){
    if(repeatTimer !== null){ clearTimeout(repeatTimer); repeatTimer = null; }
  }

  /* ─── SPEECH: SEQUENCE ─── */
  function speakSequence(){
    if(!speechOK || !speechEnabled) return;
    window.speechSynthesis.cancel();
    clearAllGlow();
    stopRepeatTimer();
    speechSeqId++;
    var mySeqId = speechSeqId;
    var q = questions[currentIndex];
    var items = [];
    
    items.push({ text: q.text, buttonIndex: -1 });
    var btns = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < btns.length; i++){
      items.push({ text: btns[i].getAttribute('data-speech'), buttonIndex: i });
    }
    
    var idx = 0;
    function speakNext(){
      if(mySeqId !== speechSeqId) return;
      if(idx >= items.length || locked){
        clearAllGlow();
        if(mySeqId === speechSeqId) startRepeatTimer();
        return;
      }
      var item = items[idx];
      var utter = new SpeechSynthesisUtterance(item.text);
      applyVoice(utter);
      utter.onstart = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        if(item.buttonIndex >= 0){
          var allBtns = elAnswers.querySelectorAll('.answer-btn');
          if(allBtns[item.buttonIndex]) allBtns[item.buttonIndex].classList.add('glow');
        }
      };
      utter.onend = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        idx++;
        setTimeout(speakNext, 400);
      };
      utter.onerror = function(){
        if(mySeqId !== speechSeqId) return;
        clearAllGlow();
        idx++;
        setTimeout(speakNext, 400);
      };
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  }

  /* ─── SPEECH: RESULT ─── */
  function speakResult(painScore, psScore, qolScore){
    if(!speechOK || !speechEnabled) return;
    window.speechSynthesis.cancel();
    stopRepeatTimer();
    speechSeqId++;
    var mySeqId = speechSeqId;
    var lines = [
      '非常感謝您完成了這份調查中所有的問題。',
      '請勿關閉此頁面，並告知您的物理治療師。',
      '您的疼痛得分是 ' + painScore + ' 分。',
      '日常活動得分是 ' + psScore + ' 分。',
      '生活質量得分是 ' + qolScore + ' 分。'
    ];
    var idx = 0;
    function speakNext(){
      if(mySeqId !== speechSeqId) return;
      if(idx >= lines.length) return;
      var utter = new SpeechSynthesisUtterance(lines[idx]);
      applyVoice(utter);
      utter.onend = function(){
        if(mySeqId !== speechSeqId) return;
        idx++;
        setTimeout(speakNext, 400);
      };
      utter.onerror = function(){
        if(mySeqId !== speechSeqId) return;
        idx++;
        setTimeout(speakNext, 400);
      };
      window.speechSynthesis.speak(utter);
    }
    speakNext();
  }

  /* ─── RENDER ─── */
  function renderQuestion(){
    locked = false;
    stopRepeatTimer();
    var q = questions[currentIndex];
    var totalQs = questions.length;
    
    elProgressTxt.textContent = '第 ' + (currentIndex + 1) + ' / ' + totalQs + ' 題';
    elProgressBar.style.width = ((currentIndex + 1) / totalQs * 100) + '%';
    elQSec.textContent = q.section;
    elQNum.textContent = '題目 ' + q.id;
    elQText.textContent = q.text;
    elAnswers.innerHTML = '';
    
    var opts = optionSets[q.optionsType];
    for(var i = 0; i < opts.length; i++){
      addButton(opts[i].emoji, opts[i].text, opts[i].val, 'lvl-' + opts[i].val);
    }
    
    window.scrollTo(0, 0);
    speakSequence();
  }

  function addButton(emoji, label, value, lvlClass){
    var btn = document.createElement('button');
    btn.className = 'answer-btn ' + lvlClass;
    if(emoji){
      var es = document.createElement('span');
      es.className = 'btn-emoji';
      es.textContent = emoji;
      btn.appendChild(es);
    }
    var ts = document.createElement('span');
    ts.textContent = label;
    btn.appendChild(ts);
    
    btn.setAttribute('data-speech', label);
    btn.addEventListener('click', function(){ onAnswer(btn, value); });
    elAnswers.appendChild(btn);
  }

  /* ─── ANSWER ─── */
  function onAnswer(btn, value){
    if(locked) return;
    locked = true;
    stopRepeatTimer();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    
    var all = elAnswers.querySelectorAll('.answer-btn');
    for(var i = 0; i < all.length; i++) all[i].classList.add('locked');
    btn.classList.remove('locked');
    btn.classList.add('selected');
    
    answers[currentIndex] = {
      type: questions[currentIndex].type,
      score: value
    };
    
    setTimeout(function(){
      currentIndex++;
      if(currentIndex < questions.length) renderQuestion();
      else showResult();
    }, 350);
  }

  /* ─── RESULT ─── */
  function showResult(){
    stopRepeatTimer();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    elQuiz.style.display = 'none';
    elResult.style.display = 'block';
    
    var rawPain = 0, countPain = 0;
    var totalRawPS = 0, countPS = 0;
    var rawQoL = 0, countQoL = 0;
    
    for(var i = 0; i < answers.length; i++){
      var ans = answers[i];
      if(ans.type === 'Pain') { rawPain += ans.score; countPain++; }
      else if(ans.type === 'PS') { totalRawPS += ans.score; countPS++; }
      else if(ans.type === 'QoL') { rawQoL += ans.score; countQoL++; }
    }
    
    // Pain 與 QoL 依然使用原來的常規平均分公式
    var scorePain = countPain > 0 ? Math.round(100 - ((rawPain / countPain) * 25)) : 100;
    var scoreQoL  = countQoL > 0  ? Math.round(100 - ((rawQoL / countQoL) * 25))   : 100;
    
    // NEW: PS 範疇改為基於 7 題的「總原始分（0-28）」直接查表對應最終得分
    var scorePS = 100; // 默認安全值
    if(countPS > 0) {
      // 確保總原始分在 0 到 28 的安全陣列範圍內
      if(totalRawPS >= 0 && totalRawPS <= 28) {
        scorePS = psConversionTable[totalRawPS];
      } else {
        scorePS = 0; // 超出預期（防呆安全鎖）
      }
    }
    
    elResultMsg.textContent = '非常感謝您完成了這份調查中所有的問題。請勿關閉此頁面，並告知您的物理治療師。';
    
    elResultScore.innerHTML = 
      '<span>1. 疼痛範疇 (Pain Score): <strong>' + scorePain + ' / 100</strong> 分</span>' +
      '<span>2. 日常活動 (PS Score): <strong>' + scorePS + ' / 100</strong> 分</span>' +
      '<span>3. 生活質量 (QoL Score): <strong>' + scoreQoL + ' / 100</strong> 分</span>';
      
    window.scrollTo(0, 0);
    speakResult(scorePain, scorePS, scoreQoL);
  }

  /* ─── RESTART ─── */
  function restart(){
    stopRepeatTimer();
    speechSeqId++;
    if(speechOK) window.speechSynthesis.cancel();
    clearAllGlow();
    startQuiz();
  }

  /* ─── INIT ─── */
  function init(){
    if(!speechOK){
      elOverlay.style.display = 'none';
      elBanner.style.display = 'block';
      startQuiz();
    } else {
      loadVoice();
      elOverlay.addEventListener('click', onOverlayTap);
    }
    elReplay.addEventListener('click', function(){
      stopRepeatTimer();
      speakSequence();
    });
    elRestart.addEventListener('click', restart);
  }

  function onOverlayTap(){
    speechEnabled = true;
    elOverlay.style.display = 'none';
    var dummy = new SpeechSynthesisUtterance('');
    dummy.lang = 'zh-HK';
    dummy.volume = 0;
    window.speechSynthesis.speak(dummy);
    startQuiz();
  }

  function startQuiz(){
    currentIndex = 0;
    answers = [];
    elResult.style.display = 'none';
    elQuiz.style.display = 'flex';
    renderQuestion();
  }

  init();
})();
</script>
</body></html>
