<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KOOS 膝關節問卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;
  background:#1e3d59;
  color:#fff;
  overflow-x:hidden;
}

/* ── Audio unlock overlay ── */
#speech-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.88);
  display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  z-index:1000;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
#speech-overlay .tap-icon{
  font-size:6rem;margin-bottom:1.5rem;
  animation:pulse 1.4s ease-in-out infinite;
}
#speech-overlay .tap-text{font-size:2.8rem;font-weight:bold;}
#speech-overlay .tap-sub{font-size:1.3rem;margin-top:.8rem;opacity:.7;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1}
  50%{transform:scale(1.18);opacity:.65}
}

/* ── App container ── */
#app{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:1rem .7rem 2rem;
}

/* ── Header ── */
.header-title{font-size:1.8rem;font-weight:bold;text-align:center;margin-top:.4rem;}
.header-sub{font-size:1.1rem;text-align:center;opacity:.75;margin-top:.2rem;margin-bottom:.8rem;}

/* ── Progress ── */
#progress-area{width:100%;max-width:700px;margin-bottom:1rem;}
#progress-text{font-size:1.6rem;font-weight:bold;text-align:center;margin-bottom:.5rem;}
#progress-bar-bg{width:100%;height:12px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;}
#progress-bar-fill{height:100%;width:0;background:#17b978;border-radius:6px;transition:width .4s ease;}

/* ── Question card ── */
#question-card{
  background:#fff;color:#222;border-radius:16px;
  padding:1.6rem 1.2rem 1rem;
  width:100%;max-width:700px;text-align:center;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.2rem;
}
#question-number{font-size:1.2rem;color:#999;margin-bottom:.35rem;font-weight:bold;}
#question-category{font-size:1.1rem;color:#e67e22;font-weight:bold;margin-bottom:.3rem;}
#question-text{font-size:2rem;font-weight:bold;line-height:1.75;}

/* ── Button row ── */
.btn-row{
  display:flex;justify-content:center;gap:.6rem;margin-top:1rem;flex-wrap:wrap;
}
.card-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.6rem 1.8rem;
  background:#ececec;color:#555;border:none;border-radius:25px;
  font-size:1.3rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.card-btn:hover{background:#ddd;}
.card-btn.active{background:#ffeaa7;color:#856404;}
#prev-btn{display:none;background:#dfe6e9;color:#2d3436;}
#prev-btn:hover{background:#b2bec3;}

/* ── Explanation panel (question level) ── */
#explanation-panel{
  display:none;
  background:#fff9e6;border:2px solid #f0d060;border-radius:12px;
  padding:1.2rem 1rem;margin-top:1rem;text-align:left;
  animation:fadeSlideDown .3s ease;
}
@keyframes fadeSlideDown{
  from{opacity:0;transform:translateY(-10px);}
  to{opacity:1;transform:translateY(0);}
}
.explain-text{font-size:1.4rem;line-height:1.8;color:#333;}
.explain-listen-btn{
  display:inline-flex;align-items:center;gap:.3rem;
  margin-top:.8rem;padding:.4rem 1.2rem;
  background:#f0d060;color:#6b5900;border:none;border-radius:20px;
  font-size:1.1rem;cursor:pointer;transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
.explain-listen-btn:hover{background:#e6c340;}

/* ── Answers area ── */
#answers-area{
  width:100%;max-width:700px;
  display:grid;grid-template-columns:1fr;gap:.75rem;
}

/* ── Answer buttons ── */
.answer-btn{
  border:none;border-radius:14px;
  padding:1.2rem 1rem;
  font-size:1.5rem;font-weight:bold;
  color:#fff;cursor:pointer;
  transition:transform .15s,opacity .15s,box-shadow .3s,filter .3s;
  box-shadow:0 5px 0 rgba(0,0,0,.22);
  text-align:center;user-select:none;
  -webkit-tap-highlight-color:transparent;
  min-height:4.2rem;
  display:flex;align-items:center;justify-content:center;
  gap:0.5rem;position:relative;
}
.answer-btn:active:not(.locked){transform:scale(.96);}
.answer-btn.locked{pointer-events:none;opacity:.35;filter:grayscale(.3);}
.answer-btn.selected{
  transform:scale(1.04);opacity:1!important;filter:none!important;
  box-shadow:0 0 0 5px #fff,0 5px 0 rgba(0,0,0,.22);
}

.answer-btn.glow{
  animation:glowPulse .7s ease-in-out infinite alternate;
  z-index:10;transform:scale(1.04);
}
@keyframes glowPulse{
  0%{
    box-shadow:0 0 12px rgba(255,255,255,0.6),0 0 24px rgba(255,255,255,0.3),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.15);
  }
  100%{
    box-shadow:0 0 24px rgba(255,255,255,1),0 0 48px rgba(255,255,255,0.5),0 0 72px rgba(255,255,255,0.2),0 5px 0 rgba(0,0,0,.22);
    filter:brightness(1.35);
  }
}

.clr-green{background:#26890c;}
.clr-blue{background:#1368ce;}
.clr-gold{background:#d89e00;}
.clr-orange{background:#e67e22;}
.clr-red{background:#e21b3c;}

/* ── Result screen ── */
#result-screen{display:none;width:100%;max-width:700px;text-align:center;}
.result-card{
  background:#fff;color:#333;border-radius:16px;
  padding:2rem 1.4rem;
  box-shadow:0 8px 32px rgba(0,0,0,.3);
  margin-bottom:1.5rem;
}
.result-msg{font-size:1.6rem;line-height:1.9;margin-bottom:1.8rem;text-align:left;}
.result-scores{font-size:2rem;font-weight:bold;color:#1e3d59;}
.result-scores span{display:block;margin:.6rem 0;}
.result-credit{font-size:1rem;color:#aaa;margin-top:1.4rem;}
#restart-btn{
  padding:1.2rem 3rem;background:#17b978;color:#fff;
  border:none;border-radius:30px;font-size:1.8rem;font-weight:bold;
  cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);
  transition:background .2s;
  -webkit-tap-highlight-color:transparent;
}
#restart-btn:hover{background:#129661;}

#quiz-area{width:100%;display:flex;flex-direction:column;align-items:center;}

@media(min-width:600px){
  #question-text{font-size:2.2rem;}
  .answer-btn{font-size:1.7rem;padding:1.4rem 1.2rem;}
  .result-msg{font-size:1.8rem;}
  .result-scores{font-size:2.4rem;}
  .explain-text{font-size:1.6rem;}
}
</style>
</head>

  var painScoreTable = [100, 97, 94, 92, 89, 86, 83, 81, 78, 75, 72, 69, 67, 64, 61, 58, 56, 53, 50, 47, 44, 42, 39, 36, 33, 31, 28, 25, 22, 19, 17, 14, 11, 8, 6, 3, 0];

  var BTN_COLORS_5 = ['clr-green', 'clr-blue', 'clr-gold', 'clr-orange', 'clr-red'];

  var currentIndex   = 0;
  var answers        = {};
  var locked         = false;
  var audioEnabled   = false;
  var explanationOpen= false;
  var currentAudio   = null;

 /* ═══════════════════ AUDIO FUNCTIONS ═══════════════════ */

function clearAllGlow(){
    var btns =
        document.querySelectorAll('.answer-btn');

    for(var i = 0; i < btns.length; i++){
        btns[i].classList.remove('glow');
    }
}

function stopInactivityTimer(){
    if(inactivityTimer !== null){
        clearTimeout(inactivityTimer);
        inactivityTimer = null;
    }
}

function startInactivityTimer(){
    stopInactivityTimer();

    inactivityTimer = setTimeout(function(){
        inactivityTimer = null;

        if(
            !locked &&
            !explanationOpen
        ){
            playQuestionAudio();
        }
    }, 20000);
}

function stopAudio(){
    /*
     * 將所有舊音訊序列失效。
     * 防止舊的 setTimeout 或事件繼續播放。
     */
    audioSequenceId++;

    if(currentAudio){
        currentAudio.onplaying = null;
        currentAudio.onended = null;
        currentAudio.onerror = null;

        currentAudio.pause();

        try{
            currentAudio.currentTime = 0;
        }catch(error){
            console.log(
                'Unable to reset audio:',
                error
            );
        }

        currentAudio = null;
    }

    clearAllGlow();
}

function playAudio(file, onEndedCb){
    stopAudio();
    stopInactivityTimer();

    if(!audioEnabled){
        if(onEndedCb){
            onEndedCb();
        }
        return;
    }

    var finished = false;
    var thisAudio = new Audio(file);

    currentAudio = thisAudio;

    function finishAudio(errorMessage, error){
        if(finished){
            return;
        }

        finished = true;

        if(errorMessage){
            console.log(
                errorMessage,
                file,
                error || ''
            );
        }

        if(currentAudio === thisAudio){
            currentAudio = null;
        }

        if(onEndedCb){
            onEndedCb();
        }
    }

    thisAudio.onended = function(){
        finishAudio();
    };

    thisAudio.onerror = function(){
        finishAudio(
            'Missing or invalid audio:'
        );
    };

    thisAudio.play().catch(function(error){
        finishAudio(
            'Unable to play audio:',
            error
        );
    });
}

function playAudioSequence(files){
    stopAudio();
    stopInactivityTimer();

    if(!audioEnabled){
        return;
    }

    var index = 0;
    var mySequenceId = audioSequenceId;
    var sequenceQuestionIndex = currentIndex;

    function sequenceIsCurrent(){
        return (
            mySequenceId === audioSequenceId &&
            sequenceQuestionIndex === currentIndex &&
            !locked &&
            !explanationOpen
        );
    }

    function next(){
        if(!sequenceIsCurrent()){
            clearAllGlow();
            return;
        }

        if(index >= files.length){
            clearAllGlow();
            currentAudio = null;

            /*
             * 題目及全部選項播放完成後，
             * 先開始計算 20 秒。
             */
            startInactivityTimer();
            return;
        }

        clearAllGlow();

        var file = files[index];
        var itemIndex = index;
        var clipFinished = false;
        var thisAudio = new Audio(file);

        currentAudio = thisAudio;

        /*
         * itemIndex 0 = 題目，不顯示選項 glow
         * itemIndex 1 = 選項 1
         * itemIndex 2 = 選項 2
         * ...
         */
        thisAudio.onplaying = function(){
            if(!sequenceIsCurrent()){
                return;
            }

            clearAllGlow();

            if(itemIndex > 0){
                var answerBtns =
                    elAnswers.querySelectorAll(
                        '.answer-btn'
                    );

                var buttonIndex =
                    itemIndex - 1;

                if(answerBtns[buttonIndex]){
                    answerBtns[buttonIndex]
                        .classList.add('glow');
                }
            }

            console.log(
                'Playing audio:',
                file
            );
        };

        function finishClip(errorMessage, error){
            if(clipFinished){
                return;
            }

            clipFinished = true;

            if(!sequenceIsCurrent()){
                return;
            }

            if(errorMessage){
                console.log(
                    errorMessage,
                    file,
                    error || ''
                );
            }

            clearAllGlow();

            if(currentAudio === thisAudio){
                currentAudio = null;
            }

            index++;

            setTimeout(function(){
                if(sequenceIsCurrent()){
                    next();
                }
            }, 300);
        }

        thisAudio.onended = function(){
            finishClip();
        };

        thisAudio.onerror = function(){
            finishClip(
                'Missing or invalid audio:'
            );
        };

        thisAudio.play().catch(function(error){
            finishClip(
                'Unable to play audio:',
                error
            );
        });
    }

    next();
}

function getQuestionAudioPath(q){
    return (
        q.section +
        '/q' + q.localNo +
        '/q' + q.localNo +
        '.mp3'
    );
}

function getOptionAudioPath(q, optionNumber){
    return (
        q.section +
        '/q' + q.localNo +
        '/q' + q.localNo +
        ' o' + optionNumber +
        '.mp3'
    );
}

function getExplanationAudioPath(q){
    return (
        q.section +
        '/q' + q.localNo +
        '/q' + q.localNo +
        ' explain.mp3'
    );
}

function playQuestionAudio(){
    if(
        currentIndex < 0 ||
        currentIndex >= questions.length
    ){
        return;
    }

    var q = questions[currentIndex];
    var files = [];

    /*
     * 例如：
     * pain/q1/q1.mp3
     */
    files.push(
        getQuestionAudioPath(q)
    );

    /*
     * 例如：
     * pain/q1/q1 o1.mp3
     * pain/q1/q1 o2.mp3
     * ...
     */
    for(var i = 0; i < q.options.length; i++){
        files.push(
            getOptionAudioPath(
                q,
                i + 1
            )
        );
    }

    console.log(
        'Question audio sequence:',
        files
    );

    playAudioSequence(files);
}

  var elOverlay      = document.getElementById('speech-overlay');
  var elProgressTxt  = document.getElementById('progress-text');
  var elProgressBar  = document.getElementById('progress-bar-fill');
  var elQNum         = document.getElementById('question-number');
  var elQCat         = document.getElementById('question-category');
  var elQText        = document.getElementById('question-text');
  var elPrevBtn      = document.getElementById('prev-btn');
  var elReplay       = document.getElementById('replay-btn');
  var elExplainBtn   = document.getElementById('explain-btn');
  var elExplainPanel = document.getElementById('explanation-panel');
  var elExplainText  = document.getElementById('explain-text');
var elExplainListen =
    document.getElementById(
        'explain-listen-btn'
    );
  var elAnswers      = document.getElementById('answers-area');
  var elQuiz         = document.getElementById('quiz-area');
  var elResult       = document.getElementById('result-screen');
  var elResultMsg    = document.getElementById('result-msg');
  var elResultScore  = document.getElementById('result-scores');
  var elRestart      = document.getElementById('restart-btn');

 function openExplanation(){
    stopInactivityTimer();
    clearAllGlow();

    explanationOpen = true;

    elExplainPanel.style.display = 'block';
    elExplainBtn.classList.add('active');

    var q = questions[currentIndex];

    playAudio(
        getExplanationAudioPath(q)
    );
}

  function closeExplanation(){
    explanationOpen = false;
    elExplainPanel.style.display = 'none';
    elExplainBtn.classList.remove('active');
  }

  function toggleExplanation(){
    if(explanationOpen){
        closeExplanation();
        stopAudio();

        setTimeout(function(){
            playQuestionAudio();
        }, 100);
    }else{
        openExplanation();
    }
}

  function renderQuestion(){
    stopInactivityTimer();
    stopAudio();
    clearAllGlow();

    locked = false;
    explanationOpen = false;

    if(
        currentIndex < 0 ||
        currentIndex >= questions.length
    ){
        return;
    }

    var q = questions[currentIndex];

    elProgressTxt.textContent =
        '第 ' +
        (currentIndex + 1) +
        ' / ' +
        questions.length +
        ' 題';

    elProgressBar.style.width =
        (
            (currentIndex + 1) /
            questions.length *
            100
        ) + '%';

    elQNum.textContent =
        '問題 ' + (currentIndex + 1);

    elQCat.textContent =
        q.sectionName;

    elQText.textContent =
        q.text;

    if(currentIndex > 0){
        elPrevBtn.style.display =
            'inline-flex';
    }else{
        elPrevBtn.style.display =
            'none';
    }

    elExplainPanel.style.display =
        'none';

    elExplainBtn.classList.remove(
        'active'
    );

    elExplainText.textContent =
        q.explanation;

    elAnswers.innerHTML = '';

    q.options.forEach(function(opt, i){
        var colorClass =
            BTN_COLORS_5[
                i % BTN_COLORS_5.length
            ];

        addScaleOption(
            opt,
            i,
            colorClass
        );
    });

    window.scrollTo(0, 0);

    playQuestionAudio();
}
function addScaleOption(
    opt,
    index,
    colorClass
){
    var btn =
        document.createElement('button');

    btn.className =
        'answer-btn ' + colorClass;

    if(
        answers[currentIndex] !== undefined &&
        answers[currentIndex] === opt.value
    ){
        btn.classList.add('selected');
    }

    var textSpan =
        document.createElement('span');

    textSpan.textContent = opt.label;

    btn.appendChild(textSpan);

    btn.addEventListener(
        'click',
        function(){
            onAnswer(
                btn,
                opt.value
            );
        }
    );

    elAnswers.appendChild(btn);
}

 function onAnswer(btn, value){
    stopInactivityTimer();

    if(locked){
        return;
    }

    locked = true;

    stopAudio();
    clearAllGlow();

    var all =
        elAnswers.querySelectorAll(
            '.answer-btn'
        );

    for(var i = 0; i < all.length; i++){
        all[i].classList.add('locked');
    }

    btn.classList.remove('locked');
    btn.classList.add('selected');

    answers[currentIndex] = value;

    setTimeout(function(){
        currentIndex++;

        if(currentIndex < questions.length){
            renderQuestion();
        }else{
            showResult();
        }
    }, 350);
}

  function prevQuestion(){
    stopInactivityTimer();
    clearAllGlow();
    if(currentIndex <= 0) return;
    stopAudio();
    currentIndex--;
    renderQuestion();
  }

 function showResult(){
    stopInactivityTimer();
    stopAudio();
    clearAllGlow();

    elQuiz.style.display = 'none';
    elResult.style.display = 'block';

    var painSubtotal = 0;
    var psSubtotal = 0;
    var qolSubtotal = 0;

    questions.forEach(function(q, idx){
        var val =
            answers[idx] !== undefined
            ? answers[idx]
            : 0;

        if(q.section === 'pain'){
            painSubtotal += val;
        }else if(q.section === 'ps'){
            psSubtotal += val;
        }else if(q.section === 'qol'){
            qolSubtotal += val;
        }
    });

    var finalPain =
        painScoreTable[painSubtotal] !== undefined
        ? painScoreTable[painSubtotal]
        : 0;

    var finalPS =
        psScoreTable[psSubtotal] !== undefined
        ? psScoreTable[psSubtotal]
        : 0;

    var finalQOL =
        qolScoreTable[qolSubtotal] !== undefined
        ? qolScoreTable[qolSubtotal]
        : 0;

    elResultMsg.textContent =
        '非常感謝您完成了這份調查中所有的問題。' +
        '請勿關閉此頁面，並告知您的物理治療師。';

    elResultScore.innerHTML =
        '<span>疼痛 (Pain) 分數: ' +
        finalPain +
        ' 分</span>' +

        '<span>日常生活困難度 (PS) 分數: ' +
        finalPS +
        ' 分</span>' +

        '<span>生活質量 (QOL) 分數: ' +
        finalQOL +
        ' 分</span>';

    window.scrollTo(0, 0);

    playAudio('result.mp3');
}

 function restart(){
    stopInactivityTimer();
    stopAudio();
    clearAllGlow();

    startQuiz();
}
function init(){
    elOverlay.addEventListener(
        'click',
        onOverlayTap
    );

    elPrevBtn.addEventListener(
        'click',
        prevQuestion
    );

    elReplay.addEventListener(
        'click',
        function(){
            stopInactivityTimer();
            closeExplanation();
            stopAudio();

            setTimeout(function(){
                playQuestionAudio();
            }, 100);
        }
    );

    elExplainBtn.addEventListener(
        'click',
        toggleExplanation
    );

    elExplainListen.addEventListener(
        'click',
        function(){
            stopInactivityTimer();

            var q =
                questions[currentIndex];

            playAudio(
                getExplanationAudioPath(q)
            );
        }
    );

    elRestart.addEventListener(
        'click',
        restart
    );
}
  function onOverlayTap(){
    audioEnabled = true;
    elOverlay.style.display = 'none';
    startQuiz();
  }

  function startQuiz(){
    stopInactivityTimer();
    stopAudio();
    clearAllGlow();

    currentIndex = 0;
    answers = {};
    locked = false;
    explanationOpen = false;

    elResult.style.display = 'none';
    elQuiz.style.display = 'flex';

    renderQuestion();
}

  init();
